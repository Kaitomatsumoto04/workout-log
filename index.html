<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホで正しい幅で表示するための必須の1行（モバイル対応の要） -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout - 筋トレ記録</title>

  <!-- PWA：ホーム画面に追加してアプリのように起動するための設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <!-- iOS用（iOSはmanifestのdisplayを見ないため個別に指定が必要） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 画面上部の見出し。全画面で共通 -->
  <header>
    <h1>Workout</h1>
  </header>

  <main>

    <!-- ⓪ ログイン画面：ログインしていないときだけ表示 -->
    <section id="screen-login" class="screen">
      <h2>ログイン</h2>
      <label>メールアドレス
        <input type="email" id="login-email" autocomplete="username">
      </label>
      <label>パスワード（6文字以上）
        <input type="password" id="login-password" autocomplete="current-password">
      </label>
      <p id="login-message"></p>
      <button id="login-button">ログイン</button>
      <button id="signup-button" class="ghost-button">新規登録</button>
      <button id="reset-password" class="sub-button">パスワードを忘れた</button>
    </section>

    <!-- ① ホーム画面：直近の履歴＋各画面へのボタン -->
    <!-- ログイン状態が分かってから表示するので、最初は active を付けない -->
    <section id="screen-home" class="screen">
      <!-- 月カレンダー -->
      <div class="calendar-header">
        <button id="prev-month" class="nav-button">‹</button>
        <span id="calendar-title"></span>
        <button id="next-month" class="nav-button">›</button>
      </div>
      <div class="calendar-weekdays">
        <span>日</span><span>月</span><span>火</span><span>水</span>
        <span>木</span><span>金</span><span>土</span>
      </div>
      <div id="calendar-days" class="calendar-days"></div>
      <div id="day-detail" class="day-detail"></div>
      <div class="home-buttons">
        <button id="go-record">記録する</button>
        <button id="go-review">振り返る</button>
      </div>
      <button id="go-menu" class="sub-button">AIトレーナー</button>
      <h2>直近の履歴</h2>
      <ul id="history-list">
        <!-- ここに記録がJSで差し込まれる（今は見本を仮置き） -->
        <li>2026-07-17 胸 ベンチプレス 60kg×10, 55kg×8</li>
        <li>2026-07-15 背中 懸垂 自重×8×3</li>
      </ul>

      <!-- バックアップ：記録をファイルに書き出す／ファイルから読み込む -->
      <h2>バックアップ</h2>
      <div class="home-buttons">
        <button id="export-data" class="ghost-button">書き出す</button>
        <button id="import-data" class="ghost-button">読み込む</button>
      </div>
      <!-- ファイル選択は見た目を変えられないので隠し、「読み込む」ボタンから開く -->
      <input type="file" id="import-file" accept=".json,application/json" hidden>

      <h2>アカウント</h2>
      <p id="account-email"></p>
      <button id="logout-button" class="ghost-button">ログアウト</button>
    </section>

    <!-- ② 記録する画面 -->
    <section id="screen-record" class="screen">
      <h2 id="record-heading">記録する</h2>

      <label>日付
        <input type="date" id="input-date">
      </label>

      <label>部位
        <select id="input-part">
          <option value="">選択してください</option>
          <option value="胸">胸</option>
          <option value="背中">背中</option>
          <option value="肩">肩</option>
          <option value="腹筋">腹筋</option>
          <option value="腕">腕</option>
          <option value="下半身">下半身</option>
          <option value="ランニング">ランニング</option>
          <option value="HIIT">HIIT</option>
        </select>
      </label>

      <label>種目
        <select id="input-exercise">
          <option value="">先に部位を選択</option>
        </select>
      </label>
      <button id="add-exercise" class="sub-button">＋ 種目を追加</button>

      <!-- セット入力（重量×回数）が並ぶ場所。JSで行を増やす -->
      <h3 id="sets-heading">セット</h3>
      <div id="sets-area" data-type="weight">
        <div class="set-row">
          <input type="number" class="set-weight" placeholder="重量kg">
          <span>kg ×</span>
          <input type="number" class="set-reps" placeholder="回数">
          <span>回</span>
        </div>
      </div>
      <button id="copy-set" class="sub-button">⧉ セットをコピー</button>
      <button id="add-set" class="sub-button">＋ セットを追加</button>

      <!-- インターバルタイマー：セット間の休憩を測り、0でアラームを鳴らす -->
      <h3>インターバル</h3>
      <div id="timer-display" class="timer-display">01:00</div>
      <div class="timer-presets">
        <button type="button" class="preset-button active" data-seconds="60">60秒</button>
        <button type="button" class="preset-button" data-seconds="90">90秒</button>
        <button type="button" class="preset-button" data-seconds="120">2分</button>
        <button type="button" class="preset-button" data-seconds="180">3分</button>
      </div>
      <div class="timer-buttons">
        <button id="timer-start">スタート</button>
        <button id="timer-reset" class="ghost-button">リセット</button>
      </div>

      <div class="record-buttons">
        <button id="save-record">記録する</button>
        <button id="back-home-1" class="ghost-button">ホームに戻る</button>
      </div>
    </section>

    <!-- ③ 振り返る画面（第2弾で中身を作る。今は枠だけ） -->
<section id="screen-review" class="screen">
      <h2>振り返る</h2>

      <label>開始日
        <input type="date" id="review-from">
      </label>
      <label>終了日
        <input type="date" id="review-to">
      </label>
      <label>部位
        <select id="review-part">
          <option value="">選択してください</option>
          <option value="胸">胸</option>
          <option value="背中">背中</option>
          <option value="肩">肩</option>
          <option value="腹筋">腹筋</option>
          <option value="腕">腕</option>
          <option value="下半身">下半身</option>
          <option value="ランニング">ランニング</option>
          <option value="HIIT">HIIT</option>
        </select>
      </label>
      <label>種目
        <select id="review-exercise">
          <option value="">先に部位を選択</option>
        </select>
      </label>

      <button id="show-graph">グラフを表示</button>
      <p id="review-message"></p>
      <canvas id="chart"></canvas>

      <button id="back-home-2" class="ghost-button">ホームに戻る</button>
    </section>

    <!-- ④ メニュー提案画面：条件を選ぶと、Gemini が今日のメニューを考える -->
    <section id="screen-menu" class="screen">
      <h2>AIトレーナー</h2>

      <!-- トレーナーからの声かけ（開くたびに、記録を見て文言を変える） -->
      <div class="trainer-row">
        <div class="trainer-avatar">AI</div>
        <div class="trainer-bubble" id="trainer-greeting"></div>
      </div>

      <label>どこを鍛えたい？
        <select id="menu-part">
          <option value="おまかせ">おまかせ</option>
          <option value="胸">胸</option>
          <option value="背中">背中</option>
          <option value="肩">肩</option>
          <option value="腹筋">腹筋</option>
          <option value="腕">腕</option>
          <option value="下半身">下半身</option>
          <option value="ランニング">ランニング</option>
          <option value="HIIT">HIIT</option>
        </select>
      </label>

      <label>時間はどれくらいある？
        <select id="menu-minutes">
          <option value="30">30分</option>
          <option value="45">45分</option>
          <option value="60" selected>60分</option>
          <option value="90">90分</option>
        </select>
      </label>

      <label>今日はどこでトレーニングする？
        <select id="menu-place">
          <option value="ジム">ジム</option>
          <option value="自宅（ダンベルあり）">自宅（ダンベルあり）</option>
          <option value="自宅（自重のみ）">自宅（自重のみ）</option>
          <option value="屋外">屋外</option>
        </select>
      </label>

      <button id="menu-generate">メニューを組んでもらう</button>
      <p class="menu-note">直近2週間の記録（種目・重量・回数）を Google の Gemini に送って考えてもらいます。メールアドレスなどは送りません。</p>

      <!-- ここにトレーナーの返事とメニューがJSで差し込まれる -->
      <div id="menu-result"></div>

      <button id="back-home-3" class="ghost-button">ホームに戻る</button>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="script.js"></script>
</body>
</html>
